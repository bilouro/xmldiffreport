# xmldiffreport usage configuration.
# Copy this to `config.toml` and adjust the paths (relative to THIS file).
#
#   cp usage/config.example.toml usage/config.toml
#   python usage/collect.py
#
# By default it points at the synthetic examples, so it runs out of the box.

recipe = "controlm"          # built-in recipe or a path to a .toml
report_dir = "reports"       # where to write reports (YYYYMMDD_HH_MM.<ext>)
format = "md"                # "md" or "html"

# Files and/or directories to compare (directories are scanned recursively).
# Add as many as you like — every *.xml found becomes one source.
inputs = [
    "../examples/controlm",
]
