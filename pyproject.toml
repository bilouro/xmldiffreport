[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmldiffreport"
version = "0.3.2"
description = "N-way structural & semantic XML diff that generates human-readable Markdown reports, driven by per-dialect recipes (Control-M, sitemaps, and more)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor H. Bilouro" }]
keywords = [
    "xml", "diff", "compare", "xml-diff", "xml-compare", "xml-comparison",
    "structural-diff", "semantic-diff", "n-way-diff", "tree-diff",
    "report", "markdown", "control-m", "controlm", "sitemap", "devops",
    "maven", "pom", "maven-pom", "junit", "junit-report", "ci",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.11",
]
docs = [
    "mkdocs-material[imaging]",
    "mkdocstrings[python]",
    "mkdocs-static-i18n",
]

[project.urls]
Homepage = "https://github.com/bilouro/xmldiffreport"
Documentation = "https://bilouro.github.io/xmldiffreport/"
Repository = "https://github.com/bilouro/xmldiffreport"
Issues = "https://github.com/bilouro/xmldiffreport/issues"
Changelog = "https://github.com/bilouro/xmldiffreport/blob/main/CHANGELOG.md"

[project.scripts]
xmldiffreport = "xmldiffreport.cli:main"
xmldiffreport-recipe = "xmldiffreport.scaffold:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xmldiffreport"]

[tool.hatch.build.targets.sdist]
include = ["src/", "examples/", "usage/", "tests/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # permite acentos/símbolos em comentários PT

[tool.mypy]
python_version = "3.11"
packages = ["xmldiffreport"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["xmldiffreport"]
branch = true

[tool.coverage.report]
show_missing = true
